name: tinycanvas

x-app-env: &app-env
  NODE_ENV: production
  PUBLIC_URL: ${PUBLIC_URL}
  DATABASE_URL: postgresql://tinycanvas:${POSTGRES_PASSWORD}@postgres:5432/tinycanvas
  SESSION_SECRET: ${SESSION_SECRET}
  TZ: ${TZ:-Asia/Taipei}

services:
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy_data:/data
    depends_on: [api, sync]
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *app-env
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      VERSION_RETENTION_DAYS: ${VERSION_RETENTION_DAYS:-0}
      STORAGE_LOCAL_DIR: /data/files
    volumes:
      - files_data:/data/files
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 10s
    restart: unless-stopped

  sync:
    build: { context: ., dockerfile: apps/sync/Dockerfile }
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/healthz"]
      interval: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tinycanvas
      POSTGRES_USER: tinycanvas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinycanvas"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backup:
    build: { context: ., dockerfile: deploy/backup/Dockerfile }
    environment:
      DATABASE_URL: postgresql://tinycanvas:${POSTGRES_PASSWORD}@postgres:5432/tinycanvas
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - files_data:/data/files:ro
      - ./backups:/backups
    depends_on: [postgres]
    restart: unless-stopped

volumes:
  caddy_data:
  files_data:
  pg_data:
