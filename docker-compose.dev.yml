# 開發用：只啟動 postgres。對應到本機 54329，避免和其他專案的 5432 衝突
name: tinycanvas-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tinycanvas
      POSTGRES_USER: tinycanvas
      POSTGRES_PASSWORD: tinycanvas
    ports: ["54329:5432"]
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
      - ./deploy/dev-init.sql:/docker-entrypoint-initdb.d/dev-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinycanvas"]
      interval: 2s
      retries: 30

volumes:
  pg_dev_data:
